  <g>
    <path d="M1810,1080 Q1820,820 1830,600 Q1835,588 1840,600 Q1835,820 1825,1080" fill="#2e1848" stroke="#2de2e6" stroke-width="1" opacity="0.7"/>
    <path d="M1834,600 Q1900,555 1960,580 Q1895,540 1834,575" fill="#2e1848" stroke="#2de2e6" stroke-width="0.8" opacity="0.7"/>
    <path d="M1834,595 Q1930,510 1975,490 Q1920,495 1834,565" fill="#2e1848" stroke="#2de2e6" stroke-width="0.8" opacity="0.7"/>
    <path d="M1834,590 Q1890,475 1900,420 Q1875,470 1832,555" fill="#2e1848" stroke="#2de2e6" stroke-width="0.8" opacity="0.7"/>
    <path d="M1830,590 Q1790,470 1730,420 Q1770,470 1828,555" fill="#2e1848" stroke="#2de2e6" stroke-width="0.8" opacity="0.7"/>
    <path d="M1830,595 Q1750,520 1690,510 Q1760,530 1830,565" fill="#2e1848" stroke="#2de2e6" stroke-width="0.8" opacity="0.7"/>
    <path d="M1830,600 Q1740,560 1680,575 Q1750,565 1830,580" fill="#2e1848" stroke="#2de2e6" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Second smaller palm - right -->
  <g>
    <path d="M1700,1080 Q1705,890 1715,740 Q1719,730 1724,740 Q1718,890 1715,1080" fill="#2e1848" stroke="#2de2e6" stroke-width="0.8" opacity="0.5"/>
    <path d="M1719,740 Q1770,710 1810,730 Q1765,700 1719,726" fill="#2e1848" stroke="#2de2e6" stroke-width="0.6" opacity="0.5"/>
    <path d="M1719,736 Q1790,680 1820,665 Q1780,670 1719,715" fill="#2e1848" stroke="#2de2e6" stroke-width="0.6" opacity="0.5"/>
    <path d="M1719,734 Q1755,660 1760,620 Q1745,655 1717,710" fill="#2e1848" stroke="#2de2e6" stroke-width="0.6" opacity="0.5"/>
    <path d="M1715,734 Q1690,660 1655,620 Q1672,660 1714,710" fill="#2e1848" stroke="#2de2e6" stroke-width="0.6" opacity="0.5"/>
    <path d="M1715,738 Q1660,700 1625,705 Q1668,700 1715,722" fill="#2e1848" stroke="#2de2e6" stroke-width="0.6" opacity="0.5"/>
