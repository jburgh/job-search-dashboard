    <line x1="0" y1="960" x2="1920" y2="960" stroke="#2de2e6" stroke-width="0.9"/>
    <line x1="0" y1="985" x2="1920" y2="985" stroke="#2de2e6" stroke-width="1"/>
    <line x1="0" y1="1015" x2="1920" y2="1015" stroke="#2de2e6" stroke-width="1.2"/>
    <line x1="0" y1="1050" x2="1920" y2="1050" stroke="#2de2e6" stroke-width="1.4"/>

    <!-- Vertical grid lines converging to vanishing point -->
    <line x1="960" y1="920" x2="0" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="160" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="320" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="480" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="640" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="800" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="960" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="1120" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="1280" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="1440" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="1600" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="1760" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
    <line x1="960" y1="920" x2="1920" y2="1080" stroke="#2de2e6" stroke-width="0.5"/>
  </g>

  <!-- ============ CORNER DECORATIONS ============ -->

  <!-- Top-left: neon triangle + squiggles -->
  <polygon points="40,60 130,200 -50,200" fill="none" stroke="#f6019d" stroke-width="2.5" opacity="0.45"/>
  <polygon points="40,80 115,190 -35,190" fill="none" stroke="#2de2e6" stroke-width="2" opacity="0.3"/>
  <path d="M30,260 Q55,240 50,270 Q45,300 70,285 Q95,270 85,300" fill="none" stroke="#f6019d" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <circle cx="45" cy="310" r="5" fill="#f6019d" opacity="0.35"/>
  <circle cx="75" cy="325" r="4" fill="#f6019d" opacity="0.3"/>
  <circle cx="30" cy="335" r="3" fill="#f6019d" opacity="0.25"/>

  <!-- Top-right: squiggles + dots -->
  <path d="M1870,120 Q1845,100 1850,135 Q1855,170 1830,155 Q1805,140 1815,175" fill="none" stroke="#2de2e6" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <circle cx="1880" cy="180" r="5" fill="#2de2e6" opacity="0.35"/>
  <circle cx="1855" cy="200" r="4" fill="#2de2e6" opacity="0.3"/>
  <circle cx="1895" cy="210" r="3" fill="#2de2e6" opacity="0.25"/>
  <path d="M1860,260 Q1885,245 1880,275 Q1875,305 1900,290" fill="none" stroke="#ff6c11" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Bottom-left: orange squiggles -->
  <path d="M50,820 Q80,800 75,835 Q70,870 100,850 Q130,830 120,865" fill="none" stroke="#ff6c11" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <circle cx="60" cy="880" r="5" fill="#ff6c11" opacity="0.35"/>
  <circle cx="95" cy="895" r="4" fill="#ff6c11" opacity="0.3"/>

  <!-- Bottom-right: pink squiggles -->
  <path d="M1870,800 Q1845,785 1850,815 Q1855,845 1830,830 Q1805,815 1815,850" fill="none" stroke="#f6019d" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <circle cx="1880" cy="860" r="5" fill="#f6019d" opacity="0.35"/>
  <circle cx="1850" cy="878" r="4" fill="#f6019d" opacity="0.3"/>

  <!-- ============ EDGE NEON LINES ============ -->

  <!-- Thin neon border lines along far edges -->
  <line x1="0" y1="0" x2="0" y2="1080" stroke="#f6019d" stroke-width="4" opacity="0.4"/>
  <line x1="1920" y1="0" x2="1920" y2="1080" stroke="#2de2e6" stroke-width="4" opacity="0.4"/>
  <line x1="0" y1="0" x2="1920" y2="0" stroke="#f6019d" stroke-width="3" opacity="0.3"/>
  <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#2de2e6" stroke-width="3" opacity="0.3"/>

  <!-- ============ SCATTERED STARS ============ -->
  <g opacity="0.5">
    <circle cx="30" cy="30" r="1.5" fill="#ffffff"/>
    <circle cx="80" cy="80" r="0.8" fill="#ffffff"/>
    <circle cx="160" cy="40" r="1" fill="#ffffff"/>
    <circle cx="50" cy="400" r="1" fill="#ffffff"/>
    <circle cx="30" cy="550" r="0.8" fill="#ffffff"/>
    <circle cx="70" cy="700" r="1.2" fill="#ffffff"/>

    <circle cx="1850" cy="50" r="1" fill="#ffffff"/>
    <circle cx="1900" cy="120" r="0.8" fill="#ffffff"/>
    <circle cx="1870" cy="300" r="1.2" fill="#ffffff"/>
    <circle cx="1895" cy="500" r="1" fill="#ffffff"/>
    <circle cx="1860" cy="650" r="0.8" fill="#ffffff"/>
    <circle cx="1890" cy="780" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Colored accent stars on edges -->
  <circle cx="60" cy="150" r="2" fill="#2de2e6" opacity="0.5"/>
  <circle cx="1880" cy="400" r="2" fill="#f6019d" opacity="0.5"/>
  <circle cx="40" cy="650" r="1.8" fill="#ff6c11" opacity="0.4"/>
  <circle cx="1900" cy="700" r="1.8" fill="#2de2e6" opacity="0.4"/>

  <!-- Edge sparkles (4-point) -->
  <g fill="#ffffff" opacity="0.4">
    <polygon points="60,450 62,456 68,458 62,460 60,466 58,460 52,458 58,456"/>
    <polygon points="1870,250 1872,256 1878,258 1872,260 1870,266 1868,260 1862,258 1868,256"/>
