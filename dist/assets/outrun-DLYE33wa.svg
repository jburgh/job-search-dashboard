<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9c80e"/>
      <stop offset="30%" stop-color="#ff6c11"/>
      <stop offset="60%" stop-color="#ff3864"/>
      <stop offset="100%" stop-color="#f6019d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="8%" r="35%">
      <stop offset="0%" stop-color="#ff3864" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#f6019d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d0221" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#f6019d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d0221" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="100%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#2de2e6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d0221" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="#0d0221"/>

  <!-- Ambient glows on edges -->
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>
  <rect width="1920" height="1080" fill="url(#glowLeft)"/>
  <rect width="1920" height="1080" fill="url(#glowRight)"/>

  <!-- ============ TOP: Sunset behind header ============ -->
  <circle cx="960" cy="-20" r="120" fill="url(#sunGrad)" opacity="0.25"/>
  <!-- Scanlines on sun -->
  <g opacity="0.12">
    <rect x="840" y="-80" width="240" height="4" fill="#0d0221"/>
    <rect x="840" y="-68" width="240" height="5" fill="#0d0221"/>
    <rect x="840" y="-54" width="240" height="6" fill="#0d0221"/>
    <rect x="840" y="-38" width="240" height="8" fill="#0d0221"/>
    <rect x="840" y="-18" width="240" height="10" fill="#0d0221"/>
    <rect x="840" y="4" width="240" height="12" fill="#0d0221"/>
  </g>

  <!-- ============ LEFT SIDE: Palm tree + decorations ============ -->

  <!-- Large palm tree - far left -->
  <g>
    <!-- Trunk -->
    <path d="M120,1080 Q105,800 90,580 Q95,565 105,580 Q115,800 130,1080" fill="#2e1848" stroke="#f6019d" stroke-width="1" opacity="0.7"/>
    <!-- Fronds with neon edge glow -->
    <path d="M96,580 Q20,530 -40,560 Q30,515 96,555" fill="#2e1848" stroke="#f6019d" stroke-width="0.8" opacity="0.7"/>
    <path d="M96,575 Q-10,490 -60,470 Q10,475 96,545" fill="#2e1848" stroke="#f6019d" stroke-width="0.8" opacity="0.7"/>
    <path d="M96,570 Q30,460 20,400 Q50,450 98,535" fill="#2e1848" stroke="#f6019d" stroke-width="0.8" opacity="0.7"/>
    <path d="M100,570 Q130,450 190,400 Q155,460 102,535" fill="#2e1848" stroke="#f6019d" stroke-width="0.8" opacity="0.7"/>
    <path d="M100,575 Q170,500 230,490 Q160,515 100,548" fill="#2e1848" stroke="#f6019d" stroke-width="0.8" opacity="0.7"/>
    <path d="M100,580 Q180,545 240,560 Q170,545 100,560" fill="#2e1848" stroke="#f6019d" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Second smaller palm - left -->
  <g>
    <path d="M220,1080 Q215,880 205,720 Q209,710 215,720 Q222,880 230,1080" fill="#2e1848" stroke="#d40078" stroke-width="0.8" opacity="0.5"/>
    <path d="M209,720 Q160,690 120,710 Q165,680 209,705" fill="#2e1848" stroke="#d40078" stroke-width="0.6" opacity="0.5"/>
    <path d="M209,716 Q135,660 105,645 Q145,648 209,695" fill="#2e1848" stroke="#d40078" stroke-width="0.6" opacity="0.5"/>
    <path d="M209,714 Q170,640 165,600 Q180,635 211,690" fill="#2e1848" stroke="#d40078" stroke-width="0.6" opacity="0.5"/>
    <path d="M213,714 Q235,640 270,600 Q252,640 214,690" fill="#2e1848" stroke="#d40078" stroke-width="0.6" opacity="0.5"/>
    <path d="M213,718 Q265,680 300,685 Q258,682 213,702" fill="#2e1848" stroke="#d40078" stroke-width="0.6" opacity="0.5"/>
  </g>

