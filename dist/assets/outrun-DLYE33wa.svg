  <!-- Flying birds near left palm -->
  <g opacity="0.2" fill="none" stroke="#1a0a2e" stroke-width="1.5">
    <path d="M140,500 Q148,492 156,500 Q164,492 172,500"/>
    <path d="M170,520 Q176,514 182,520 Q188,514 194,520"/>
    <path d="M115,530 Q121,524 127,530 Q133,524 139,530"/>
